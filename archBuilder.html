<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow & Architecture Builder</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='7' height='7' rx='1.5' fill='%235b6bfa'/%3E%3Crect x='14' y='3' width='7' height='7' rx='1.5' fill='%235b6bfa'/%3E%3Crect x='3' y='14' width='7' height='7' rx='1.5' fill='%235b6bfa'/%3E%3Crect x='14' y='14' width='7' height='7' rx='1.5' fill='%235b6bfa'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1117">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg-dark:#0f1117;--bg-canvas:#1a1d27;--bg-panel:#161923;--bg-card:#1e2230;
    --bg-hover:#252a3a;--border:#2a2f3f;--border-active:#5b6bfa;
    --text-primary:#e8eaf0;--text-secondary:#9aa0b8;--text-muted:#6b7190;
    --accent:#5b6bfa;--accent-glow:rgba(91,107,250,.25);
    --green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;
    --purple:#a78bfa;--pink:#f472b6;--orange:#fb923c;--cyan:#22d3ee;
    --node-trigger:var(--accent);--node-ai:var(--purple);--node-webhook:var(--green);
    --node-email:var(--blue);--node-delay:var(--yellow);--node-condition:var(--orange);
    --node-db:var(--pink);--node-action:var(--cyan);
  }
  html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-dark);color:var(--text-primary);overflow:hidden}

  /* ── Layout ── */
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--bg-panel);border-bottom:1px solid var(--border);z-index:100;flex-shrink:0}
  .topbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.3px}
  .topbar-brand svg{opacity:.85}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .topbar-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin-right:12px}
  .topbar-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}

  /* ── Overflow menu (topbar) ── */
  .topbar-overflow{position:relative}
  .topbar-overflow-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--bg-dark);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s,color .15s}
  .topbar-overflow-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
  .topbar-overflow-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:200;display:none}
  .topbar-overflow-menu.show{display:block}

  /* ── Focus / accessibility ── */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  button:focus-visible,.node-item:focus-visible,.zoom-btn:focus-visible,.ctx-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::selection{background:var(--accent-glow);color:var(--text-primary)}

  .main{display:flex;flex:1;overflow:hidden}

  /* ── Left Sidebar: Node Palette ── */
  .sidebar-left{width:240px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
  .sidebar-header{padding:10px 12px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between}
  .sidebar-header button{
    font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);
    background:var(--bg-dark);color:var(--text-muted);cursor:pointer;opacity:0.8;transition:all .15s;
  }
  .sidebar-header button:hover{background:var(--bg-hover);color:var(--text-secondary);opacity:1}
  .palette-filter{padding:4px 8px 6px}
  .palette-filter input{
    width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);
    background:var(--bg-dark);color:var(--text-primary);font-size:11px;outline:none;
    transition:border-color .15s;
  }
  .palette-filter input::placeholder{color:var(--text-muted);font-size:10px}
  .palette-filter input:focus{border-color:var(--accent)}
  .palette-group{border-bottom:1px solid var(--border)}
  .palette-group-header{
    display:flex;align-items:center;gap:6px;
    padding:9px 12px 7px;font-size:10px;
    font-weight:600;text-transform:uppercase;letter-spacing:.8px;
    color:var(--text-muted);cursor:pointer;user-select:none;
  }
  .palette-group-header:hover{color:var(--text-secondary)}
  .palette-group-header .chev{
    font-size:9px;transition:transform .18s;
    display:inline-flex;align-items:center;
  }
  .palette-group.collapsed .palette-group-header .chev{
    transform:rotate(-90deg);
  }
  .palette-group-header .group-title{flex:1}
  .palette-group-header .count{
    font-size:9px;color:var(--text-muted);
    background:var(--bg-hover);padding:1px 6px;
    border-radius:99px;
  }
  .palette-items{
    overflow-y:auto;
    max-height:60vh;
    transition:max-height .22s ease, opacity .18s ease;
  }
  .palette-group.collapsed .palette-items{
    max-height:0 !important;
    opacity:0;
    pointer-events:none;
    overflow:hidden;
  }
  .node-item{display:flex;align-items:center;gap:9px;padding:7px 12px;cursor:grab;margin:1px 6px;border-radius:8px;font-size:12px;font-weight:500;color:var(--text-primary);transition:background .15s,color .15s;user-select:none}
  .node-item:hover{background:var(--bg-hover)}
  .node-item .icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
  .node-item .node-type-label{font-size:9px;color:var(--text-muted);display:block;margin-top:1px;font-weight:400}
  .custom-btn{
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;margin:4px 8px 6px;
    border-radius:8px;border:1px dashed var(--border);
    background:transparent;color:var(--text-secondary);
    font-size:11px;cursor:pointer;width:calc(100% - 16px);
    transition:background .15s,color .15s;
  }
  .custom-btn:hover{background:var(--bg-hover);color:var(--text-primary)}

  .custom-item-actions{
    display:flex;gap:4px;margin-left:auto;opacity:0;transition:opacity .15s;
  }
  .node-item:hover .custom-item-actions{opacity:1}
  .custom-item-actions button{
    width:20px;height:20px;border-radius:4px;border:none;
    background:var(--bg-elevated);color:var(--text-secondary);
    font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .custom-item-actions button:hover{background:var(--bg-hover);color:var(--text-primary)}
  .custom-item-actions .del-btn:hover{color:#ff5c5c}

  /* ── Canvas ── */
  .canvas-container{flex:1;position:relative;overflow:hidden;cursor:grab;background:var(--bg-canvas)}
  .canvas-container.grabbing{cursor:grabbing}
  .canvas-container.connecting{cursor:crosshair}
  .canvas{position:absolute;transform-origin:0 0}
  .canvas-grid{position:absolute;inset:-5000px;width:10000px;height:10000px;background-image:radial-gradient(circle,var(--border) .8px,transparent .8px);background-size:24px 24px;opacity:.4}

  /* ── Node Cards ── */
  .node{position:absolute;width:200px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.3);transition:box-shadow .2s,border-color .2s;user-select:none;z-index:10}
  .node:hover{box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .node.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),0 4px 20px rgba(0,0,0,.4)}
  .node-header{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-radius:10px 10px 0 0;cursor:grab}
  .node-header .n-icon{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .node-header .n-title{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node-body{padding:4px 12px 10px}
  .node-body .n-desc{font-size:11px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node-body .n-tag{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--text-muted)}

  /* Ports */
  .port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg-card);border:2px solid var(--border);cursor:crosshair;z-index:20;transition:border-color .15s,transform .15s,background .15s}
  .port:hover{border-color:var(--accent);transform:scale(1.3);background:var(--accent)}
  .port.port-right{right:-6px;top:50%;transform:translateY(-50%)}
  .port.port-right:hover{transform:translateY(-50%) scale(1.3)}
  .port.port-left{left:-6px;top:50%;transform:translateY(-50%)}
  .port.port-left:hover{transform:translateY(-50%) scale(1.3)}
  .port.port-top{top:-6px;left:50%;transform:translateX(-50%)}
  .port.port-top:hover{transform:translateX(-50%) scale(1.3)}
  .port.port-bottom{bottom:-6px;left:50%;transform:translateX(-50%)}
  .port.port-bottom:hover{transform:translateX(-50%) scale(1.3)}
  .port.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
  .port.connected{background:var(--border-active);border-color:var(--border-active)}
  .port-label{position:absolute;font-size:9px;color:var(--text-muted);white-space:nowrap;pointer-events:none}

  /* Delete button */
  .node .delete-btn{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--red);border:2px solid var(--bg-card);color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;z-index:30}
  .node:hover .delete-btn,.node.selected .delete-btn{display:flex}

  /* ── SVG Connections ── */
  .connections-svg{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
  .connections-svg path{fill:none;stroke:var(--text-muted);stroke-width:2;pointer-events:stroke;transition:stroke .15s,stroke-width .15s}
  .connections-svg path:hover{stroke:var(--accent);stroke-width:3;pointer-events:stroke;cursor:pointer}
  .connections-svg path.active{stroke:var(--accent);stroke-width:2.5}
  .connections-svg .arrow{fill:var(--accent);pointer-events:none}

  /* Temp connection line */
  .connections-svg .temp-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}

  /* ── Right Sidebar: Properties ── */
  .sidebar-right-wrapper{position:relative;display:flex;align-items:flex-start}
  .sidebar-right{width:300px;flex-shrink:0;background:var(--bg-panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;transition:width .2s}
  .sidebar-right.collapsed{width:0;border:none;overflow:hidden}
  .sidebar-toggle-btn{position:fixed;top:50%;right:300px;transform:translateY(-50%);width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:right .2s,background .15s,color .15s;z-index:60}
  .sidebar-toggle-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
  .props-panel{padding:0}
  .props-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .props-header h3{font-size:14px;font-weight:600}
  .props-close{width:24px;height:24px;border-radius:6px;border:none;background:var(--bg-hover);color:var(--text-secondary);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
  .props-close:hover{background:var(--bg-dark);color:var(--text-primary)}

  .prop-section{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
  .prop-section h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin-bottom:10px}
  .prop-row{margin-bottom:10px}
  .prop-row label{display:block;font-size:11.5px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
  .prop-row input,.prop-row select,.prop-row textarea{width:100%;padding:8px 10px;background:var(--bg-dark);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:12.5px;font-family:inherit;outline:none;transition:border-color .15s}
  .prop-row input:focus,.prop-row select:focus,.prop-row textarea:focus{border-color:var(--accent)}
  .prop-row textarea{resize:vertical;min-height:60px}
  .prop-row select{cursor:pointer}
  .prop-row input[type="color"]{height:34px;padding:4px;cursor:pointer}

  .btn{padding:8px 14px;border-radius:6px;border:none;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;font-family:inherit}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#4a5ae8}
  .btn-danger{background:rgba(248,113,113,.15);color:var(--red)}
  .btn-danger:hover{background:rgba(248,113,113,.25)}
  .btn-sm{padding:5px 10px;font-size:11px}
  .btn-block{width:100%;margin-top:6px}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary)}

  /* ── Summary Panel ── */
  .summary-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:10px 20px;display:flex;gap:24px;align-items:center;z-index:50;box-shadow:0 4px 24px rgba(0,0,0,.35);white-space:nowrap}
  .summary-item{text-align:center}
  .summary-item .s-val{font-size:18px;font-weight:700;line-height:1.2}
  .summary-item .s-label{font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .summary-divider{width:1px;height:30px;background:var(--border)}

  /* ── Minimap ── */
  .minimap{position:absolute;bottom:80px;right:16px;width:160px;height:110px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;z-index:50;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.3)}
  .minimap-viewport{position:absolute;border:1px solid var(--accent);background:var(--accent-glow);pointer-events:none;border-radius:2px}
  .minimap-node{position:absolute;width:6px;height:4px;background:var(--text-muted);border-radius:1px}

  /* ── Zoom Controls ── */
  .zoom-controls{position:absolute;bottom:80px;left:16px;display:flex;flex-direction:column;gap:4px;z-index:50}
  .zoom-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s;border:none}
  .zoom-btn:hover{background:var(--bg-hover)}
  .zoom-level{font-size:11px;color:var(--text-muted);text-align:center;padding:4px 0}

  /* ── Context Menu ── */
  .ctx-menu{position:fixed;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:200;display:none}
  .ctx-menu.show{display:block}
  .ctx-item{padding:7px 12px;font-size:12.5px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-primary);transition:background .1s}
  .ctx-item:hover{background:var(--bg-hover)}
  .ctx-item.danger{color:var(--red)}
  .ctx-item.danger:hover{background:rgba(248,113,113,.1)}
  .ctx-sep{height:1px;background:var(--border);margin:4px 0}

  /* ── Scrollbar ── */
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

  /* ── Tooltip ── */
  .tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--bg-dark);border:1px solid var(--border);color:var(--text-secondary);padding:4px 10px;border-radius:6px;font-size:11px;white-space:nowrap;pointer-events:none;z-index:300;opacity:0;transition:opacity .15s}
  .node:hover .tooltip{opacity:1}

  /* ── Animations ── */
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .node{animation:fadeIn .25s ease}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .running .port{animation:pulse 1.2s infinite}

  /* ── Empty state ── */
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
  .empty-state svg{opacity:.3;margin-bottom:12px}
  .empty-state p{font-size:13px;line-height:1.6}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:center;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px;min-width:340px;max-width:90vw;box-shadow:0 16px 48px rgba(0,0,0,.5)}
  .modal h3{font-size:16px;margin-bottom:6px}
  .modal p{font-size:13px;color:var(--text-secondary);margin-bottom:16px}

  /* ── Keyboard shortcut hints ── */
  .kbd{display:inline-block;padding:1px 5px;background:var(--bg-dark);border:1px solid var(--border);border-radius:3px;font-size:10px;color:var(--text-muted);font-family:monospace}
</style>
</head>
<body>
<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><line x1="10" y1="6.5" x2="14" y2="6.5" stroke-dasharray="2 2"/><line x1="6.5" y1="10" x2="6.5" y2="14" stroke-dasharray="2 2"/><line x1="17.5" y1="10" x2="17.5" y2="14" stroke-dasharray="2 2"/></svg>
      Workflow & Architecture Builder
    </div>
    <div class="topbar-status"><span class="dot"></span> Ready</div>
    <div class="topbar-actions">
      <input type="file" id="fileInput" accept=".wflow,.json" style="display:none" onchange="openFlow(event)">
      <button class="btn btn-ghost btn-sm" onclick="createNew()" title="Create new workflow">+ New</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('fileInput').click()" title="Open a saved flow">Open</button>
      <button class="btn btn-ghost btn-sm" onclick="downloadFlow()" title="Download flow as JSON">↓ Save</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleSummary()" title="Toggle summary">Summary</button>
      <button class="btn btn-primary btn-sm" onclick="runWorkflow()">▶ Run</button>
      <div class="topbar-overflow">
        <button class="topbar-overflow-btn" id="topbarOverflowBtn" aria-label="More actions" aria-expanded="false">⋮</button>
        <div class="topbar-overflow-menu" id="topbarOverflowMenu" role="menu">
          <div class="ctx-item" role="menuitem" onclick="clearCache()">🧹 Clear Cache</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Left Sidebar: Node Palette -->
    <div class="sidebar-left">
      <div class="sidebar-header">
        Node Types
        <button id="collapseAllBtn" title="Collapse/expand all groups">Collapse All</button>
      </div>
      <div class="palette-filter">
        <input type="text" id="paletteFilter" placeholder="Filter components…" aria-label="Filter components">
      </div>
      <div id="nodePalette"></div>
    </div>

    <!-- Canvas -->
    <div class="canvas-container" id="canvasContainer">
      <div class="canvas" id="canvas">
        <div class="canvas-grid"></div>
        <svg class="connections-svg" id="connectionsSvg"></svg>
      </div>

      <!-- Minimap -->
      <div class="minimap" id="minimap"></div>

      <!-- Zoom Controls -->
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()" title="Zoom in">+</button>
        <div class="zoom-level" id="zoomLevel">100%</div>
        <button class="zoom-btn" onclick="zoomOut()" title="Zoom out">−</button>
        <button class="zoom-btn" onclick="resetZoom()" title="Reset view" style="margin-top:4px;font-size:12px">⌂</button>
      </div>

      <!-- Summary Bar -->
      <div class="summary-bar" id="summaryBar">
        <div class="summary-item"><div class="s-val" id="sumNodes">0</div><div class="s-label">Nodes</div></div>
        <div class="summary-divider"></div>
        <div class="summary-item"><div class="s-val" id="sumConnections">0</div><div class="s-label">Links</div></div>

let nodes = [];

let nextId = 1;
let connectingFrom = null;

// Undo/redo
let undoStack = [];
let redoStack = [];
const MAX_UNDO = 80;

// Canvas pan/zoom
let panX = 0, panY = 0, scale = 1;

// Drag
let dragNode = null, dragOffset = {x:0,y:0};

// ═══════════════════════════════════════════
// UNDO / REDO
// ═══════════════════════════════════════════
function pushUndo(){
  const snap = JSON.stringify({ nodes, connections });
  undoStack.push(snap);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
}

function undo(){
  if (!undoStack.length) return;
  pushRedoFromCurrent();
  const data = JSON.parse(undoStack.pop());
  applyState(data.nodes, data.connections);
}

function redo(){
  if (!redoStack.length) return;
  pushUndoFromCurrent();
  const data = JSON.parse(redoStack.pop());
  applyState(data.nodes, data.connections);
}

function pushRedoFromCurrent(){
  const snap = JSON.stringify({ nodes, connections });
  redoStack.push(snap);
  if (redoStack.length > MAX_UNDO) redoStack.shift();
}

function pushUndoFromCurrent(){
  const snap = JSON.stringify({ nodes, connections });
  undoStack.push(snap);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function applyState(nextNodes, nextConns){
  // Clean DOM
  document.querySelectorAll('.node').forEach(el => el.remove());
  nodes = nextNodes;
  connections = nextConns;
  selectedNodeId = null;
  nextId = nodes.reduce((m, n) => Math.max(m, n.id || 0), 0) + 1;
  nodes.forEach(n => renderNode(n));
  renderConnections();
  updateSummary();
  updateMinimap();
  updatePropsPanel();
}

// ═══════════════════════════════════════════
// LOCAL STORAGE (Browser Cache)
// ═══════════════════════════════════════════
const LS_WORKFLOW_KEY = 'wf_last_workflow';
const LS_CUSTOM_KEY = 'wf_custom_types';
const LS_PALETTE_GROUPS_KEY = 'wf_palette_groups';

function saveToLocalStorage(){
  try {
    const data = {
      version: 1,
      nodes,
      connections,
      nextId
    };
    localStorage.setItem(LS_WORKFLOW_KEY, JSON.stringify(data));

    localStorage.setItem(LS_CUSTOM_KEY, JSON.stringify(CUSTOM_TYPES));
  } catch (e) {
    // Storage full or unavailable; silently ignore
  }
}

function loadFromLocalStorage(){
  try {
    const raw = localStorage.getItem(LS_WORKFLOW_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.connections)) return null;
    return data;
  } catch (e) {
    return null;
  }
}

function loadCustomFromLocalStorage(){
  try {
    const raw = localStorage.getItem(LS_CUSTOM_KEY);
    if (!raw) return {};
    const data = JSON.parse(raw);
    return (data && typeof data === 'object') ? data : {};
  } catch (e) {
    return {};
  }
}

function loadPaletteGroupStates(){
  try {
    const raw = localStorage.getItem(LS_PALETTE_GROUPS_KEY);
    if (!raw) return {};
    const data = JSON.parse(raw);
    return (data && typeof data === 'object') ? data : {};
  } catch (e) {
    return {};
  }
}

function savePaletteGroupStates(states){
  try {
    localStorage.setItem(LS_PALETTE_GROUPS_KEY, JSON.stringify(states));
  } catch (e) {
    // ignore
  }
}
// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init(){
// Load custom types from cache
  const cachedCustom = loadCustomFromLocalStorage();
  Object.assign(CUSTOM_TYPES, cachedCustom);
  buildPalette();
  setupCanvasEvents();
   const cached = loadFromLocalStorage();

  if (cached) {
    // Restore cached workflow (even if empty, to respect Clear)
    nodes = cached.nodes || [];
    connections = cached.connections || [];
    nextId = cached.nextId || (nodes.reduce((m, n) => Math.max(m, n.id || 0), 0) + 1);

    nodes.forEach(n => renderNode(n));
    renderConnections();
    updateSummary();
    updateMinimap();
  } else {
    // No cache at all: load sample workflow
    loadSampleWorkflow();
  }
}

  header.addEventListener('click', () => {
    group.classList.toggle('collapsed');

  const items = document.createElement('div');
  items.className = 'palette-items';

function setupCanvasEvents(){
  const container = document.getElementById('canvasContainer');

  container.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  container.addEventListener('drop', e => {
    e.preventDefault();
    const type = e.dataTransfer.getData('nodeType');
    if(!type) return;
    const rect = container.getBoundingClientRect();
    const x = (e.clientX - rect.left - panX) / scale;
    const y = (e.clientY - rect.top - panY) / scale;
    addNode(type, x - 100, y - 30);
  });

  container.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  container.addEventListener('wheel', onWheel, {passive:false});
  container.addEventListener('contextmenu', onContextMenu);
  window.addEventListener('click', (e) => {
    hideContextMenu();
    if(!e.target.closest('.topbar-overflow')) closeTopbarOverflow();
  });
  window.addEventListener('keydown', onKeyDown);

  // Palette filter
  const filterInput = document.getElementById('paletteFilter');
  if(filterInput){
    filterInput.addEventListener('input', applyPaletteFilter);
  }

  // Collapse All / Expand All button
  const collapseBtn = document.getElementById('collapseAllBtn');
  if(collapseBtn){
    collapseBtn.addEventListener('click', () => {
      const groups = document.querySelectorAll('.palette-group');
      const allCollapsed = Array.from(groups).every(g => g.classList.contains('collapsed'));
      groups.forEach(g => {
        if(allCollapsed) g.classList.remove('collapsed');
        else g.classList.add('collapsed');
      });
      collapseBtn.textContent = allCollapsed ? 'Collapse All' : 'Expand All';

      const states = loadPaletteGroupStates();
      groups.forEach(g => {
        const titleEl = g.querySelector('.group-title');
        if(titleEl){
          states[titleEl.textContent] = g.classList.contains('collapsed');
        }
      });
      savePaletteGroupStates(states);
    });
  }

  // Overflow menu
  const overflowBtn = document.getElementById('topbarOverflowBtn');
  const overflowMenu = document.getElementById('topbarOverflowMenu');
  overflowBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = overflowMenu.classList.contains('show');
    overflowMenu.classList.toggle('show');
    overflowBtn.setAttribute('aria-expanded', String(!isOpen));
  });
  overflowBtn.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      overflowBtn.click();
    }
  });

  setupMinimapEvents();

  // Right sidebar toggle
  const rightPanel = document.getElementById('sidebarRight');
  const rightToggle = document.getElementById('sidebarRightToggle');
  if(rightToggle && rightPanel){
    function updateTogglePos(){
      rightToggle.style.right = rightPanel.classList.contains('collapsed') ? '16px' : '300px';
    }
    updateTogglePos();
    rightToggle.addEventListener('click', () => {
      rightPanel.classList.toggle('collapsed');
      rightToggle.textContent = rightPanel.classList.contains('collapsed') ? '▶' : '◀';
      updateTogglePos();
    });
  }
}

function getCanvasPos(e){
  const rect = document.getElementById('canvasContainer').getBoundingClientRect();
  return { x: (e.clientX - rect.left - panX) / scale, y: (e.clientY - rect.top - panY) / scale };
}

function onMouseDown(e){
  hideContextMenu();
  if(e.target.closest('.node')){
    const nodeEl = e.target.closest('.node');
    const nodeId = parseInt(nodeEl.dataset.id);

    // Port click — start connection (any port allowed)
    if(e.target.classList.contains('port')){
      connectingFrom = { nodeId, side: e.target.dataset.side || 'right' };
      isConnecting = true;
      e.target.classList.add('active');
      e.stopPropagation();
      document.getElementById('canvasContainer').classList.add('connecting');
      return;
    }

    // Delete button
    if(e.target.classList.contains('delete-btn')){
      deleteNode(nodeId);
      return;
    }

    selectNode(nodeId);

    // Start dragging node
    const node = nodes.find(n => n.id === nodeId);
    if(node){
      dragNode = node;
      const pos = getCanvasPos(e);
      dragOffset = { x: pos.x - node.x, y: pos.y - node.y };
      document.getElementById('canvasContainer').classList.add('grabbing');
    }
    return;
  }

  // Background click — pan or deselect
  if(e.button === 0){
    if(e.target.closest('.connections-svg') || e.target.closest('.canvas-grid') || e.target.closest('.canvas-container') === e.currentTarget){
      if(!e.target.closest('.node')){
        deselectAll();
        isPanning = true;
        panStart = { x: e.clientX - panX, y: e.clientY - panY };
        document.getElementById('canvasContainer').classList.add('grabbing');
      }
    }
  }
}

function onMouseMove(e){
  if(dragNode){
    const pos = getCanvasPos(e);
    dragNode.x = pos.x - dragOffset.x;
    dragNode.y = pos.y - dragOffset.y;
    renderNode(dragNode);
    renderConnections();
    updateMinimap();
  }
  if(isPanning){
    panX = e.clientX - panStart.x;
    panY = e.clientY - panStart.y;
    updateCanvasTransform();
    updateMinimap();
  }
  if(isConnecting && connectingFrom !== null){
    renderTempConnection(e);
  }
}

function onMouseUp(e){
  if(dragNode){
    dragNode = null;
    document.getElementById('canvasContainer').classList.remove('grabbing');
    saveToLocalStorage();
  }
  if(isPanning){
    isPanning = false;
    document.getElementById('canvasContainer').classList.remove('grabbing');
  }
  if(isConnecting){
    const port = e.target.closest('.port');
    if(port){
      const toId = parseInt(port.closest('.node').dataset.id);
      const fromInfo = (typeof connectingFrom === 'object') ? connectingFrom : { nodeId: connectingFrom };
      const toSide = port.dataset.side || 'left';
      if(toId !== fromInfo.nodeId){
        const existing = connections.some(c =>
          (c.from === fromInfo.nodeId && c.to === toId) ||
          (c.from === toId && c.to === fromInfo.nodeId)
        );
        if(!existing){
          pushUndo();
          connections.push({
            from: fromInfo.nodeId,
            to: toId,
            fromSide: fromInfo.side || 'right',
            toSide
          });
          renderConnections();
          updateSummary();
          saveToLocalStorage();
        }
      }
    }
    const fromPort = document.querySelector(`.port.active[data-node-id="${(typeof connectingFrom === 'object') ? connectingFrom.nodeId : connectingFrom}"]`);
    if(fromPort) fromPort.classList.remove('active');
    isConnecting = false;
    connectingFrom = null;
    document.getElementById('canvasContainer').classList.remove('connecting');
    removeTempLine();
  }
}

function onWheel(e){
  e.preventDefault();
  const container = document.getElementById('canvasContainer');
  const rect = container.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const oldScale = scale;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(2, Math.max(0.2, scale * delta));

  // Zoom-to-cursor: keep world point under cursor fixed on screen
  panX = mx - (mx - panX) * (scale / oldScale);
  panY = my - (my - panY) * (scale / oldScale);

  updateCanvasTransform();
  document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
  renderConnections();
  updateMinimap();
}

// Minimap click-to-pan
function setupMinimapEvents(){
  const mm = document.getElementById('minimap');
  mm.addEventListener('mousedown', (e) => {
    if(e.target.classList.contains('minimap-viewport') || e.target.classList.contains('minimap-node')) return;
    e.stopPropagation();
    const rect = mm.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if(nodes.length === 0) return;

    const padding = 100;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 200);
      maxY = Math.max(maxY, n.y + 80);
    });

    const rangeX = maxX - minX + padding * 2 || 1;
    const rangeY = maxY - minY + padding * 2 || 1;
    const mmW = 160, mmH = 110;
    const scaleX = mmW / rangeX;
    const scaleY = mmH / rangeY;
    const s = Math.min(scaleX, scaleY);

    const worldX = (mx / s) + minX - padding;
    const worldY = (my / s) + minY - padding;

    const container = document.getElementById('canvasContainer');
    const cvRect = container.getBoundingClientRect();
    const centerX = cvRect.width / 2;
    const centerY = cvRect.height / 2;

    panX = centerX - worldX * scale;
    panY = centerY - worldY * scale;

    updateCanvasTransform();
    renderConnections();
    updateMinimap();
  });
}

function updateCanvasTransform(){
  const canvas = document.getElementById('canvas');
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function onKeyDown(e){
  const inInput = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);

  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(inInput) return;
    if(selectedNodeId !== null) deleteNode(selectedNodeId);
  }

  // Undo (Ctrl+Z / Cmd+Z)
  if((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey){
    e.preventDefault();
    undo();
    return;
  }

  // Redo (Ctrl+Shift+Z / Cmd+Shift+Z or Ctrl+Y)
  if(((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z') ||
     ((e.ctrlKey || e.metaKey) && e.key === 'y')){
    e.preventDefault();
    redo();
    return;
  }

  // Duplicate (Ctrl+D / Cmd+D)
  if((e.ctrlKey || e.metaKey) && e.key === 'd' && !inInput){
    e.preventDefault();
    duplicateNode();
    return;
  }

  // Copy (Ctrl+C / Cmd+C)
  if((e.ctrlKey || e.metaKey) && e.key === 'c' && !inInput && selectedNodeId !== null){
    const node = nodes.find(n => n.id === selectedNodeId);
    if(node){
      e.preventDefault();
      clipboardNode = JSON.parse(JSON.stringify(node));
    }
    return;
  }

  // Paste (Ctrl+V / Cmd+V)
  if((e.ctrlKey || e.metaKey) && e.key === 'v' && !inInput && clipboardNode){
    e.preventDefault();
    const src = clipboardNode;
    const node = addNode(src.type, src.x + 30, src.y + 30);
    if(node){
      node.name = src.name + ' (copy)';
      node.settings = JSON.parse(JSON.stringify(src.settings));
      renderNode(node);
      saveToLocalStorage();
    }
    return;
  }

  if(e.key === 'Escape'){
    deselectAll();
    hideContextMenu();
    removeTempLine();
    closeTopbarOverflow();
    if(isConnecting){
      isConnecting = false;
      connectingFrom = null;
      document.getElementById('canvasContainer').classList.remove('connecting');
    }
  }
}

}

  if(type === 'pipeline') { node.settings.steps = 'load,train,persist'; node.settings.retry = '3'; }
  if(type === 'preprocessing') { node.settings.techniques = 'normalize,encode'; node.settings.output = ''; }
  if(type === 'tuning') { node.settings.method = 'grid'; node.settings.search_space = ''; }
  if(type === 'monitoring') { node.settings.metrics = 'latency,accuracy'; node.settings.alert_threshold = '0.1'; }
  if(type === 'retraining') { node.settings.schedule = '0 0 * * *'; node.settings.trigger = 'drift'; }
  if(type === 'mlops') { node.settings.stages = 'data,train,evaluate,deploy'; node.settings.tools = 'MLflow'; }
  if(type === 'llm') { node.settings.provider = 'OpenAI'; node.settings.context = '4k'; }
  if(type === 'anon') { node.settings.strategy = 'mask'; node.settings.fields = 'email,phone,social_security'; node.settings.preserve_format = 'true'; }

  nodes.push(node);
  renderNode(node);
  selectNode(node.id);
  updateSummary();
  saveToLocalStorage();
  return node;
}

function deleteNode(id){
  pushUndo();
  nodes = nodes.filter(n => n.id !== id);
  connections = connections.filter(c => c.from !== id && c.to !== id);
  if(selectedNodeId === id){ selectedNodeId = null; updatePropsPanel(); }
  const el = document.querySelector(`.node[data-id="${id}"]`);
  if(el){ el.style.opacity = '0'; el.style.transform = 'scale(.9)'; setTimeout(() => el.remove(), 200); }
  renderConnections();
  updateSummary();
  updateMinimap();
  saveToLocalStorage();
}

function duplicateNode(){
  if(!selectedNodeId) return;
  pushUndo();
  const orig = nodes.find(n => n.id === selectedNodeId);
  if(!orig) return;
  const node = addNode(orig.type, orig.x + 40, orig.y + 40);
  node.name = orig.name + ' (copy)';
  node.settings = { ...orig.settings };
  renderNode(node);
  saveToLocalStorage();
}

function renamePrompt(){
  if(!selectedNodeId) return;
  const node = nodes.find(n => n.id === selectedNodeId);
  if(!node) return;
  showModal('Rename Node', 'Enter a new name for this node.', node.name, (val) => {
    node.name = val || node.name;
    node.settings.name = val || node.name;
    renderNode(node);
    updatePropsPanel();
    saveToLocalStorage();
  });
}

function selectNode(id){
  selectedNodeId = id;
  document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`.node[data-id="${id}"]`);
  if(el) el.classList.add('selected');
  updatePropsPanel();
}

function deselectAll(){
  selectedNodeId = null;
  selectedConnIdx = null;
  document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.conn-x-btn').forEach(el => el.remove());
  updatePropsPanel();
}

// ═══════════════════════════════════════════
// RENDER NODE
// ═══════════════════════════════════════════
function renderNode(node){
  let el = document.querySelector(`.node[data-id="${node.id}"]`);
  const def = resolveType(node.type);
  if(!def) return;
  if(!el){
    el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = node.id;
    el.innerHTML = `
      <button class="delete-btn" title="Delete node">✕</button>
      <div class="node-header" style="border-bottom:2px solid ${def.color}44">
        <div class="n-icon" style="background:${def.color}22;color:${def.color}">${def.icon}</div>
        <div class="n-title" title="${node.name}">${node.name}</div>
      </div>
      <div class="node-body">
        <div class="n-desc">${def.desc}</div>
        <span class="n-tag">${def.label}</span>
      </div>
      <div class="port port-top" data-node-id="${node.id}" data-side="top" title="Port (top)"></div>
      <div class="port port-bottom" data-node-id="${node.id}" data-side="bottom" title="Port (bottom)"></div>
      <div class="port port-left" data-node-id="${node.id}" data-side="left" title="Port (left)"></div>
      <div class="port port-right" data-node-id="${node.id}" data-side="right" title="Port (right)"></div>
    `;
    document.getElementById('canvas').appendChild(el);
  }
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  el.querySelector('.n-title').textContent = node.name;
  return el;
}

// ═══════════════════════════════════════════
// CONNECTIONS
// ═══════════════════════════════════════════
function renderConnections(){
  const svg = document.getElementById('connectionsSvg');
  // Clear all previous content including defs
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  // Single shared defs
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');

  // Forward arrow marker
  const markerEnd = document.createElementNS('http://www.w3.org/2000/svg','marker');
  markerEnd.setAttribute('id','arrow');
  markerEnd.setAttribute('markerWidth','10');
  markerEnd.setAttribute('markerHeight','7');
  markerEnd.setAttribute('refX','11');
  markerEnd.setAttribute('refY','3.5');
  markerEnd.setAttribute('orient','auto');
  const polygonEnd = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  polygonEnd.setAttribute('points','0 0, 10 3.5, 0 7');
  polygonEnd.setAttribute('fill','var(--text-muted)');
  markerEnd.appendChild(polygonEnd);
  defs.appendChild(markerEnd);

  // Reverse arrow marker (for bidirectional)
  const markerStart = document.createElementNS('http://www.w3.org/2000/svg','marker');
  markerStart.setAttribute('id','arrow-start');
  markerStart.setAttribute('markerWidth','10');
  markerStart.setAttribute('markerHeight','7');
  markerStart.setAttribute('refX','9');
  markerStart.setAttribute('refY','3.5');
  markerStart.setAttribute('orient','auto-start-reverse');
  const polygonStart = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  polygonStart.setAttribute('points','0 0, 10 3.5, 0 7');
  polygonStart.setAttribute('fill','var(--text-muted)');
  markerStart.appendChild(polygonStart);
  defs.appendChild(markerStart);

  svg.appendChild(defs);

  // Remove old X buttons
  document.querySelectorAll('.conn-x-btn').forEach(el => el.remove());

  connections.forEach((conn, i) => {
    const fromEl = document.querySelector(`.node[data-id="${conn.from}"]`);
    const toEl = document.querySelector(`.node[data-id="${conn.to}"]`);
    if(!fromEl || !toEl) return;

    const fromSide = conn.fromSide || 'right';
    const toSide = conn.toSide || 'left';
    const fromRect = getPortRect(fromEl, fromSide);
    const toRect = getPortRect(toEl, toSide);

    const mx = (fromRect.x + toRect.x) / 2;
    const dy = Math.max(30, Math.abs(toRect.y - fromRect.y) * 0.4);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const d = `M ${fromRect.x} ${fromRect.y} C ${mx} ${fromRect.y + dy}, ${mx} ${toRect.y - dy}, ${toRect.x} ${toRect.y}`;
    path.setAttribute('d', d);
    path.setAttribute('data-conn-idx', i);
    path.setAttribute('marker-end', 'url(#arrow)');
    if(conn.bidirectional){
      path.setAttribute('marker-start', 'url(#arrow-start)');
    }

    if(selectedNodeId && (conn.from === selectedNodeId || conn.to === selectedNodeId)){
      path.classList.add('active');
    }

    // Left-click: select connection and show X button at midpoint
    path.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedConnIdx = (selectedConnIdx === i) ? null : i;
      renderConnections();
    });

    path.title = 'Click to select connection';

    svg.appendChild(path);

    // If this connection is selected, show X button at midpoint
    if(selectedConnIdx === i){
      const midX = mx;
      const midY = (fromRect.y + toRect.y) / 2;
      showConnXButton(midX, midY, i);
    }
  });
}

function showConnXButton(canvasX, canvasY, connIdx){
  // Remove existing
  document.querySelectorAll('.conn-x-btn').forEach(el => el.remove());
  document.querySelectorAll('.conn-bidi-btn').forEach(el => el.remove());

  const btn = document.createElement('button');
  btn.className = 'conn-x-btn';
  btn.textContent = '✕';
  btn.setAttribute('aria-label', 'Remove connection');
  btn.setAttribute('data-conn-idx', connIdx);

  // Transform canvas coords to screen coords
  const rect = document.getElementById('canvasContainer').getBoundingClientRect();
  const screenX = rect.left + canvasX * scale + panX;
  const screenY = rect.top + canvasY * scale + panY;

  btn.style.position = 'fixed';
  btn.style.left = (screenX - 10) + 'px';
  btn.style.top = (screenY - 10) + 'px';
  btn.style.zIndex = '150';
  btn.style.width = '22px';
  btn.style.height = '22px';
  btn.style.borderRadius = '999px';
  btn.style.border = '1px solid var(--border)';
  btn.style.background = 'var(--bg-card)';
  btn.style.color = 'var(--red)';
  btn.style.fontSize = '12px';
  btn.style.cursor = 'pointer';
  btn.style.display = 'inline-flex';
  btn.style.alignItems = 'center';
  btn.style.justifyContent = 'center';
  btn.style.boxShadow = '0 2px 8px rgba(0,0,0,0.35)';
  btn.style.transition = 'background .15s,color .15s';

  btn.addEventListener('mouseenter', () => {
    btn.style.background = 'var(--red)';
    btn.style.color = '#fff';
  });
  btn.addEventListener('mouseleave', () => {
    btn.style.background = 'var(--bg-card)';
    btn.style.color = 'var(--red)';
  });
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const idx = parseInt(btn.dataset.connIdx);
    if(!isNaN(idx) && idx < connections.length){
      pushUndo();
      connections.splice(idx, 1);
      selectedConnIdx = null;
      document.querySelectorAll('.conn-x-btn,.conn-bidi-btn').forEach(el => el.remove());
      renderConnections();
      updateSummary();
      saveToLocalStorage();
    }
  });

  document.body.appendChild(btn);

  // Bidirectional toggle button next to X
  const conn = connections[connIdx];
  const bidiBtn = document.createElement('button');
  bidiBtn.className = 'conn-bidi-btn';
  bidiBtn.textContent = '⇆';
  bidiBtn.setAttribute('aria-label', 'Toggle bidirectional arrows');
  bidiBtn.setAttribute('data-conn-idx', connIdx);

  bidiBtn.style.position = 'fixed';
  bidiBtn.style.left = (screenX + 14) + 'px';
  bidiBtn.style.top = (screenY - 10) + 'px';
  bidiBtn.style.zIndex = '150';
  bidiBtn.style.width = '22px';
  bidiBtn.style.height = '22px';
  bidiBtn.style.borderRadius = '999px';
  bidiBtn.style.border = '1px solid var(--border)';
  bidiBtn.style.background = conn.bidirectional ? 'var(--accent)' : 'var(--bg-card)';
  bidiBtn.style.color = conn.bidirectional ? '#fff' : 'var(--text-muted)';
  bidiBtn.style.fontSize = '11px';
  bidiBtn.style.cursor = 'pointer';
  bidiBtn.style.display = 'inline-flex';
  bidiBtn.style.alignItems = 'center';
  bidiBtn.style.justifyContent = 'center';
  bidiBtn.style.boxShadow = '0 2px 8px rgba(0,0,0,0.35)';
  bidiBtn.style.transition = 'background .15s,color .15s';

  bidiBtn.addEventListener('mouseenter', () => {
    if(!conn.bidirectional){
      bidiBtn.style.background = 'var(--accent-glow)';
      bidiBtn.style.color = 'var(--accent)';
    }
  });
  bidiBtn.addEventListener('mouseleave', () => {
    if(!conn.bidirectional){
      bidiBtn.style.background = 'var(--bg-card)';
      bidiBtn.style.color = 'var(--text-muted)';
    }
  });
  bidiBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const idx = parseInt(bidiBtn.dataset.connIdx);
    if(!isNaN(idx) && idx < connections.length){
      pushUndo();
      connections[idx].bidirectional = !connections[idx].bidirectional;
      selectedConnIdx = null;
      document.querySelectorAll('.conn-x-btn,.conn-bidi-btn').forEach(el => el.remove());
      renderConnections();
      saveToLocalStorage();
    }
  });

  document.body.appendChild(bidiBtn);
}

function getPortRect(el, side){
  const w = el.offsetWidth;
  const h = el.offsetHeight;
  const x = el.offsetLeft;
  const y = el.offsetTop;
  if(side === 'top')    return { x: x + w / 2, y: y };
  if(side === 'bottom') return { x: x + w / 2, y: y + h };
  if(side === 'left')   return { x: x, y: y + h / 2 };
  return                 { x: x + w, y: y + h / 2 };
}

function renderTempConnection(e){
  removeTempLine();
  const fromInfo = (typeof connectingFrom === 'object') ? connectingFrom : { nodeId: connectingFrom, side: 'right' };
  const fromNode = nodes.find(n => n.id === fromInfo.nodeId);
  if(!fromNode) return;
  const fromEl = document.querySelector(`.node[data-id="${fromInfo.nodeId}"]`);
  if(!fromEl) return;

  const svg = document.getElementById('connectionsSvg');
  const rect = document.getElementById('canvasContainer').getBoundingClientRect();

  const p = getPortRect(fromEl, fromInfo.side || 'right');
  const mx = (e.clientX - rect.left - panX) / scale;
  const my = (e.clientY - rect.top - panY) / scale;

  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', p.x);
  line.setAttribute('y1', p.y);
  line.setAttribute('x2', mx);
  line.setAttribute('y2', my);
  line.classList.add('temp-line');
  svg.appendChild(line);
}
function removeTempLine(){
  document.querySelectorAll('.temp-line').forEach(el => el.remove());
}

// ═══════════════════════════════════════════
// PROPERTIES PANEL
// ═══════════════════════════════════════════
function updatePropsPanel(){
  const panel = document.getElementById('propsPanel');
  if(!selectedNodeId){
    panel.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg><p>Select a node to<br>edit its properties</p></div>';
    return;
  }
  const node = nodes.find(n => n.id === selectedNodeId);
  if(!node) return;
  const def = resolveType(node.type);
  if(!def){
    panel.innerHTML = '<div class="empty-state"><p>Unknown node type.</p></div>';
    return;
  }

  let html = `
    <div class="props-header"><h3>${def.icon} ${def.label}</h3><button class="props-close" onclick="deselectAll()">✕</button></div>
    <div class="prop-section">
      <h4>Details</h4>
      <div class="prop-row"><label>Name</label><input type="text" value="${escHtml(node.name)}" onchange="updateNodeProp(${node.id},'name',this.value)"></div>
      <div class="prop-row"><label>Type</label><select disabled><option>${def.label}</option></select></div>
    </div>
    <div class="prop-section"><h4>Settings</h4>`;

  for(const prop of def.props){
    const val = node.settings[prop] ?? '';
    if(prop === 'body' || prop === 'script' || prop === 'query'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><textarea onchange="updateNodeProp(${node.id},'${prop}',this.value)">${escHtml(String(val))}</textarea></div>`;
    } else if(prop === 'method' || prop === 'unit' || prop === 'model'){
      const opts = prop === 'method' ? 'GET,POST,PUT,DELETE' : prop === 'unit' ? 'seconds,minutes,hours,days' : 'gpt-4,gpt-3.5,gemini-2.5,llama-3';
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)">${opts.split(',').map(o=>`<option${String(val)===o?' selected':''}>${o}</option>`).join('')}</select></div>`;
    } else if(prop === 'temperature'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><input type="range" min="0" max="2" step="0.1" value="${val||0.7}" oninput="this.nextElementSibling.textContent=this.value;updateNodeProp(${node.id},'${prop}',parseFloat(this.value))"><span style="font-size:12px;color:var(--text-secondary)">${val||0.7}</span></div>`;
    } else if(prop === 'duration'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><input type="number" min="0" value="${val||1}" onchange="updateNodeProp(${node.id},'${prop}',parseInt(this.value)||0)"></div>`;
    } else if(prop === 'engine'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)"><option${val==='PostgreSQL'?' selected':''}>PostgreSQL</option><option${val==='MySQL'?' selected':''}>MySQL</option><option${val==='MongoDB'?' selected':''}>MongoDB</option><option${val==='Redis'?' selected':''}>Redis</option><option${val==='Cassandra'?' selected':''}>Cassandra</option></select></div>`;
    } else if(prop === 'language'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)"><option${val==='TypeScript'?' selected':''}>TypeScript</option><option${val==='Python'?' selected':''}>Python</option><option${val==='Go'?' selected':''}>Go</option><option${val==='Java'?' selected':''}>Java</option><option${val==='Node.js'?' selected':''}>Node.js</option><option${val==='C#'?' selected':''}>C#</option></select></div>`;
    } else if(prop === 'type' && (node.type === 'web' || node.type === 'proxy')){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)"><option${val==='Nginx'?' selected':''}>Nginx</option><option${val==='HAProxy'?' selected':''}>HAProxy</option><option${val==='API Gateway'?' selected':''}>API Gateway</option><option${val==='Cloudflare'?' selected':''}>Cloudflare</option></select></div>`;
    } else if(prop === 'type' && node.type === 'queue'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)"><option${val==='RabbitMQ'?' selected':''}>RabbitMQ</option><option${val==='Kafka'?' selected':''}>Kafka</option><option${val==='SQS'?' selected':''}>SQS</option><option${val==='Redis Streams'?' selected':''}>Redis Streams</option></select></div>`;
    } else if(prop === 'provider' && node.type === 'waf'){
      const wafOpts = ['Cloudflare','AWS WAF','Azure WAF','GCP Cloud Armor','F5 BIG-IP','Imperva','Akamai','Sucuri','Other'];
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)">${wafOpts.map(o=>`<option${val===o?' selected':''}>${o}</option>`).join('')}</select></div>`;
    } else if(prop === 'provider'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)"><option${val==='S3'?' selected':''}>S3</option><option${val==='GCS'?' selected':''}>GCS</option><option${val==='Azure Blob'?' selected':''}>Azure Blob</option><option${val==='Auth0'?' selected':''}>Auth0</option><option${val==='Keycloak'?' selected':''}>Keycloak</option></select></div>`;
    } else if(prop === 'mode'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)"><option${val==='OIDC'?' selected':''}>OIDC</option><option${val==='SAML'?' selected':''}>SAML</option><option${val==='JWT'?' selected':''}>JWT</option></select></div>`;
    } else if(prop === 'level'){
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><select onchange="updateNodeProp(${node.id},'${prop}',this.value)"><option${val==='Info'?' selected':''}>Info</option><option${val==='Debug'?' selected':''}>Debug</option><option${val==='Error'?' selected':''}>Error</option></select></div>`;
    } else {
      html += `<div class="prop-row"><label>${prop.charAt(0).toUpperCase()+prop.slice(1)}</label><input type="text" value="${escHtml(String(val))}" onchange="updateNodeProp(${node.id},'${prop}',this.value)"></div>`;
    }
  }

  html += `</div>
    <div class="prop-section">
      <h4>Actions</h4>
      <button class="btn btn-primary btn-block btn-sm" onclick="duplicateNode()">⧉ Duplicate Node</button>
      <button class="btn btn-danger btn-block btn-sm" onclick="deleteNode(${node.id})">✕ Delete Node</button>
    </div>`;

  panel.innerHTML = html;
}

function updateNodeProp(nodeId, prop, value){
  const node = nodes.find(n => n.id === nodeId);
  if(!node) return;
  node.settings[prop] = value;
  if(prop === 'name'){
    node.name = value;
    renderNode(node);
  }
  updateSummary();
  saveToLocalStorage();
}

// ═══════════════════════════════════════════
// SUMMARY
// ═══════════════════════════════════════════
function updateSummary(){
  document.getElementById('sumNodes').textContent = nodes.length;
  document.getElementById('sumConnections').textContent = connections.length;
  const types = new Set(nodes.map(n => n.type));
  document.getElementById('sumTypes').textContent = types.size;

  // Estimate duration from delay nodes
  let totalSec = 0;
  nodes.filter(n => n.type === 'delay').forEach(n => {
    const dur = n.settings.duration || 0;
    const unit = n.settings.unit || 'seconds';
    const mult = {seconds:1, minutes:60, hours:3600, days:86400}[unit] || 1;
    totalSec += dur * mult;
  });

  if(totalSec === 0) {
    document.getElementById('sumDuration').textContent = '—';
  } else if(totalSec < 60) {
    document.getElementById('sumDuration').textContent = totalSec + 's';
  } else if(totalSec < 3600) {
    document.getElementById('sumDuration').textContent = Math.floor(totalSec/60) + 'm';
  } else {
    document.getElementById('sumDuration').textContent = Math.floor(totalSec/3600) + 'h ' + Math.floor((totalSec%3600)/60) + 'm';
  }
}

// ═══════════════════════════════════════════
// MINIMAP
// ═══════════════════════════════════════════
function updateMinimap(){
  const mm = document.getElementById('minimap');
  if(nodes.length === 0){ mm.innerHTML = ''; return; }

  const padding = 100;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + 200);
    maxY = Math.max(maxY, n.y + 80);
  });

  const rangeX = maxX - minX + padding * 2 || 1;
  const rangeY = maxY - minY + padding * 2 || 1;
  const mmW = 160, mmH = 110;
  const scaleX = mmW / rangeX;
  const scaleY = mmH / rangeY;
  const s = Math.min(scaleX, scaleY);

  let html = '';
  nodes.forEach(n => {
    const mx = (n.x - minX + padding) * s;
    const my = (n.y - minY + padding) * s;
    const def = resolveType(n.type);
    const bg = def ? def.color + '88' : 'var(--text-muted)';
    html += `<div class="minimap-node" style="left:${mx}px;top:${my}px;width:${4*s}px;height:${6*s}px;background:${bg}"></div>`;
  });

  // Viewport indicator
  const cv = document.getElementById('canvasContainer');
  const vpX = (-panX / scale - minX + padding) * s;
  const vpY = (-panY / scale - minY + padding) * s;
  const vpW = (cv.clientWidth / scale) * s;
  const vpH = (cv.clientHeight / scale) * s;
  html += `<div class="minimap-viewport" style="left:${vpX}px;top:${vpY}px;width:${vpW}px;height:${vpH}px"></div>`;

  mm.innerHTML = html;
}

// ═══════════════════════════════════════════
function zoomIn(){ scale = Math.min(2, scale * 1.15); updateCanvasTransform(); document.getElementById('zoomLevel').textContent = Math.round(scale*100)+'%'; renderConnections(); updateMinimap(); }
function zoomOut(){ scale = Math.max(0.2, scale / 1.15); updateCanvasTransform(); document.getElementById('zoomLevel').textContent = Math.round(scale*100)+'%'; renderConnections(); updateMinimap(); }
function resetZoom(){ scale = 1; panX = 0; panY = 0; updateCanvasTransform(); document.getElementById('zoomLevel').textContent = '100%'; renderConnections(); updateMinimap(); }

function deleteSelected(){
  if(selectedNodeId !== null) deleteNode(selectedNodeId);
}

function createNew(){
  if(nodes.length > 0 && !confirm('Start new workflow? Current nodes will be cleared.')) return;
  clearAll();
}

function clearAll(){
  if(nodes.length === 0) return;
  document.querySelectorAll('.node').forEach(el => el.remove());
  document.getElementById('connectionsSvg').querySelectorAll('path, marker, defs').forEach(el => el.remove());
  nodes = []; connections = []; selectedNodeId = null;
  updatePropsPanel(); updateSummary(); updateMinimap();
  saveToLocalStorage();
}

function toggleSummary(){
  const bar = document.getElementById('summaryBar');
  bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
}

function clearCache(){
  if(!confirm('Clear all cached data (workflow, custom components, group states)?\nThis cannot be undone.')) return;
  localStorage.removeItem(LS_WORKFLOW_KEY);
  localStorage.removeItem(LS_CUSTOM_KEY);
  localStorage.removeItem(LS_PALETTE_GROUPS_KEY);
  location.reload();
}

function runWorkflow(){
  if(nodes.length === 0){
    alert('No nodes to run. Add some nodes first!');
    return;
  }
  // Animate: highlight nodes in sequence
  const container = document.getElementById('canvasContainer');
  container.classList.add('running');
  const triggerNodes = nodes.filter(n => n.type === 'trigger');
  const queue = [...triggerNodes];
  const visited = new Set();

  function processNext(){
    if(queue.length === 0){
      setTimeout(() => container.classList.remove('running'), 500);
      return;
    }
    const node = queue.shift();
    if(visited.has(node.id)) { processNext(); return; }
    visited.add(node.id);
    const el = document.querySelector(`.node[data-id="${node.id}"]`);
    if(el){
      el.style.boxShadow = '0 0 0 4px var(--green), 0 0 20px rgba(52,211,153,.3)';
      setTimeout(() => {
        el.style.boxShadow = '';
        const outs = connections.filter(c => c.from === node.id);
        outs.forEach(c => {
          if(!visited.has(c.to)) queue.push(nodes.find(n => n.id === c.to));
        });
        processNext();
      }, 600);
    }
  }
  processNext();
}

function showModal(title, desc, defaultVal, onConfirm){
  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>${title}</h3><p>${desc}</p>
    <input type="text" id="modalInput" value="${escHtml(defaultVal)}" style="width:100%;padding:8px 10px;background:var(--bg-dark);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;margin-bottom:16px;outline:none;font-family:inherit">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" id="modalConfirm">Confirm</button>
    </div>
  `;
  overlay.classList.add('show');
  const input = document.getElementById('modalInput');
  input.focus();
  input.select();
  const doConfirm = () => {
    const val = input.value.trim();
    closeModal();
    if(val) onConfirm(val);
  };
  document.getElementById('modalConfirm').addEventListener('click', doConfirm);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') doConfirm(); if(e.key === 'Escape') closeModal(); });
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

        color,

        icon,
        color,

function deleteCustomType(key){
  if(!CUSTOM_TYPES[key]) return;

  const nodesOfType = nodes.filter(n => n.type === 'custom_' + key);
  if(nodesOfType.length > 0){
    if(!confirm(`Delete this custom component?\n\n${nodesOfType.length} node(s) using it will also be removed.`)) return;
  } else {
    if(!confirm('Delete this custom component?')) return;
  }

  delete CUSTOM_TYPES[key];
  nodesOfType.forEach(n => deleteNode(n.id));
  buildPalette();
  saveToLocalStorage();
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════
// DOWNLOAD / OPEN FLOW
// ═══════════════════════════════════════════
function downloadFlow(){
  const data = {
    version: 1,
    nodes,
    connections,
    customTypes: CUSTOM_TYPES
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'workflow.wflow';
  a.click();
  URL.revokeObjectURL(url);
}

function openFlow(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.nodes || !data.connections) {
        alert('Invalid workflow file.');
        return;
      }

      // Clear current
      document.querySelectorAll('.node').forEach(el => el.remove());
      nodes = [];
      connections = [];
      selectedNodeId = null;
      nextId = 1;

      // Load custom types if present
      if(data.customTypes){
        Object.assign(CUSTOM_TYPES, data.customTypes);
      }

      // Import nodes
      nodes = data.nodes;
      connections = data.connections;

      // Ensure nextId is large enough
      const maxId = nodes.reduce((m, n) => Math.max(m, n.id || 0), 0);
      nextId = maxId + 1;

      // Re-render
      nodes.forEach(n => renderNode(n));
      renderConnections();
      updateSummary();
      updateMinimap();
      buildPalette();
      updatePropsPanel();
    } catch(err){
      alert('Error loading file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
